name: 每日股市与基金简报

on:
  schedule:
    # 北京时间 14:05 对应 UTC 06:05，但 GitHub 定时任务排队通常延迟约 40 分钟，
    # 因此提前到 UTC 05:25（北京时间 13:25）触发；脚本内再锁定两个时刻：
    # 13:45 后采集行情，14:00 整再推送微信，把送达时间收窄到 14:00-14:05。
    - cron: '25 5 * * 1-5'
  workflow_dispatch:
    inputs:
      offline:
        description: 使用样例数据生成（不联网，仅测试）
        required: false
        default: false
        type: boolean
      dry-run:
        description: 只生成文档，不发布不推送微信
        required: false
        default: false
        type: boolean
      no-push:
        description: 发布文档但不推送微信
        required: false
        default: false
        type: boolean
      verify-ai:
        description: 仅验证 AI 分析师接口（样例数据，不生成报告不推送）
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r stock_daily_report/requirements.txt

      - name: 运行每日简报
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: kycloudy789/stock-daily-report
          # AI 分析师：不配置 Key 时自动降级为系统规则方案；配置任意 OpenAI 兼容接口即可启用。
          AI_ANALYST_API_KEY: ${{ secrets.AI_ANALYST_API_KEY }}
          AI_ANALYST_BASE_URL: ${{ secrets.AI_ANALYST_BASE_URL }}
          AI_ANALYST_MODEL: ${{ secrets.AI_ANALYST_MODEL }}
        run: >-
          python -B stock_daily_report/run_daily.py
          ${{ github.event_name == 'schedule' && '--collect-after 13:45 --push-after 14:00' || '' }}
          ${{ inputs.offline && '--offline' || '' }}
          ${{ inputs.dry-run && '--dry-run' || '' }}
          ${{ inputs.no-push && '--no-push' || '' }}
          ${{ inputs.verify-ai && '--verify-ai' || '' }}
